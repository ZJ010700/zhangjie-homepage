<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="张杰的矢量头像">
  <!-- 底色：墨黑（与站内反色面板、favicon 同一套品牌色） -->
  <rect width="800" height="1000" fill="#101014"/>

  <!-- 内框发丝线 -->
  <rect x="48" y="48" width="704" height="904" fill="none" stroke="#f2f1ee" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 角落十字（印刷对位标记风格） -->
  <g stroke="#f2f1ee" stroke-opacity="0.45" stroke-width="3" fill="none">
    <path d="M96 96 v40 M76 116 h40"/>
    <path d="M704 864 v40 M684 884 h40"/>
  </g>

  <!-- 右上装饰：同心圆 -->
  <g fill="none" stroke="#f2f1ee" stroke-opacity="0.22" stroke-width="2">
    <circle cx="636" cy="196" r="72"/>
    <circle cx="636" cy="196" r="44"/>
  </g>
  <circle cx="636" cy="196" r="8" fill="#2d81ff"/>

  <!-- 左下装饰：斜线组 -->
  <g stroke="#f2f1ee" stroke-opacity="0.2" stroke-width="3" fill="none">
    <path d="M96 856 l88 -88"/>
    <path d="M96 800 l64 -64"/>
    <path d="M96 744 l40 -40"/>
  </g>

  <!-- 主字母 Z（几何构成） -->
  <g fill="#f2f1ee">
    <rect x="220" y="360" width="360" height="66"/>
    <rect x="220" y="700" width="360" height="66"/>
  </g>
  <line x1="548" y1="436" x2="252" y2="690" stroke="#f2f1ee" stroke-width="88"/>

  <!-- 品牌蓝点（"Z."） -->
  <circle cx="644" cy="733" r="46" fill="#2d81ff"/>

  <!-- 底部印刷标记行 -->
  <g>
    <rect x="220" y="880" width="22" height="22" fill="#f2f1ee"/>
    <rect x="258" y="880" width="22" height="22" fill="none" stroke="#f2f1ee" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="302" cy="891" r="11" fill="#2d81ff"/>
    <line x1="360" y1="891" x2="580" y2="891" stroke="#f2f1ee" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
